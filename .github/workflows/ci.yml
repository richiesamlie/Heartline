name: CI

# Checks every pull request (and manual runs): lint, license headers, tests,
# screenshots and that docs/screenshots matches the recorded goldens.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Commits must be authored by the owner, without AI attribution lines (CLAUDE.md).
  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit authorship
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new branch or force push has no usable "before"; check the pushed commit alone then.
          if ! git cat-file -e "${RANGE%%..*}^{commit}" 2>/dev/null; then RANGE="${RANGE##*..}~1..${RANGE##*..}"; fi
          python3 tools/ci/check-commits.py "$RANGE"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v6

      - name: License headers and logging
        run: |
          python3 tools/ci/license-headers.py
          python3 tools/ci/check-logging.py

      - name: Lint and unit tests
        run: ./gradlew --console=plain ktlintCheck test

      - name: Check if UI or screenshots changed
        id: ui_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...HEAD" | grep -qE '^(bubbles|docs/screenshots|tools/screenshots|gradle)/|/(ui|report|res|snapshots)/|ScreenshotTest\.kt$|BrandAssetsTest\.kt$|SampleData\.kt$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No UI or screenshot files changed; skipping Paparazzi verification."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Paparazzi screenshot tests
        if: steps.ui_changes.outputs.changed == 'true'
        run: ./gradlew --console=plain verifyPaparazziDebug

      - name: Screenshots in docs are up to date
        if: steps.ui_changes.outputs.changed == 'true'
        run: |
          pip install -q -r tools/screenshots/requirements.txt
          python3 tools/screenshots/sync.py --check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/paparazzi/failures/
          if-no-files-found: ignore
